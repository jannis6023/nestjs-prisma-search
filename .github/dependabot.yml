version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # ts-jest 29 requires typescript <7; lift once ts-jest supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
