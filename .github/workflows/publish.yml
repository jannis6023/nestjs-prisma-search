name: Publish

# Publishes to npm when a version tag (v1.2.3, v1.3.0-beta.1) is pushed.
# Authenticates through npm trusted publishing (OIDC): no npm token is stored
# in this repository, and npm attaches a provenance attestation that links the
# published tarball to this workflow run.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Require npm with trusted publishing support
        run: |
          npm_version="$(npm --version)"
          lowest="$(printf '%s\n11.5.1\n' "$npm_version" | sort -V | head -n1)"
          if [ "$lowest" != "11.5.1" ]; then
            echo "::error::npm $npm_version is too old for trusted publishing (needs 11.5.1+)."
            exit 1
          fi

      - name: Check tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi
          # Prereleases (1.3.0-beta.1) must not become `latest`.
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish
        run: npm publish --tag "${{ steps.version.outputs.dist_tag }}"
